---
# artifact-name gives each firmware a clear, self-describing filename in the output
# dir (the build script uses it verbatim, e.g. eyelash_corne_right_touchpad.uf2).
#
# Hardware matches LXF-YZP/zmk-config-rolio *master* (42-key Corne + TPS65 touchpad +
# SSD1306 OLED): LEFT = central + SSD1306 OLED (I2C0 @0x3c, via the nice_oled widgets);
# RIGHT = peripheral + touchpad (I2C0 @0x74). Both halves own I2C0 on P0.17/P0.20.
include:
  - board: eyelash_corne_left
    shield: nice_oled
    artifact-name: eyelash_corne_left_oled
    #snippet: zmk-usb-logging    # Uncomment to log over USB.
  - board: eyelash_corne_right
    # No display shield: this half carries the TPS65 touchpad on I2C0 (the display
    # SPI0 is disabled here so I2C0 can own P0.17/P0.20). See eyelash_corne_right.dts.
    artifact-name: eyelash_corne_right_touchpad
    #snippet: zmk-usb-logging
  - board: eyelash_corne_left
    shield: settings_reset
    # NOTE: this is the LEFT-half settings reset (unsuffixed name kept for back-compat).
    artifact-name: eyelash_corne_settings_reset
    #snippet: zmk-usb-logging
  - board: eyelash_corne_right
    shield: settings_reset
    # RIGHT-half settings reset. Clearing bonds after a split re-flash must be done on
    # BOTH halves or the untouched half keeps a stale bond and pairing fails
    # (bt_smp peer reason 0x3 / Security failed err 4).
    artifact-name: eyelash_corne_right_settings_reset
    #snippet: zmk-usb-logging

