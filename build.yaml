---
# artifact-name gives each firmware a clear, self-describing filename in the output
# dir (the build script uses it verbatim, e.g. eyelash_corne_right_touchpad.uf2).
#
# Hardware matches LXF-YZP/zmk-config-rolio@tps65 (same 42-key Corne + TPS65
# touchpad + vista508 LS0xx display): LEFT = central + vista508 display; RIGHT =
# peripheral + touchpad (on I2C0, sharing the display connector's P0.17/P0.20 pins).
include:
  - board: eyelash_corne_left
    shield: vista508
    artifact-name: eyelash_corne_left_vista508
    #snippet: zmk-usb-logging    # Uncomment to log over USB.
  - board: eyelash_corne_right
    # No display shield: this half carries the TPS65 touchpad on I2C0 (the display
    # SPI0 is disabled here so I2C0 can own P0.17/P0.20). See eyelash_corne_right.dts.
    artifact-name: eyelash_corne_right_touchpad
    #snippet: zmk-usb-logging
  - board: eyelash_corne_left
    shield: settings_reset
    artifact-name: eyelash_corne_settings_reset
    #snippet: zmk-usb-logging
 
