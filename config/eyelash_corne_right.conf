# Right half (peripheral): the Azoteq IQS5xx touchpad replaced the right-half
# OLED, so there is no display on this side. Disable the display subsystem here
# only; the left half keeps its nice_epaper screen (eyelash_corne.conf stays y).
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n
