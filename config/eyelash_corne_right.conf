# Right half (peripheral): the Azoteq IQS5xx touchpad replaced the right-half
# OLED, so there is no display on this side. Disable the display subsystem here
# only; the left half keeps its nice_epaper screen (eyelash_corne.conf stays y).
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n

# =============================================================================
# Right-half (touchpad) battery savings. Full analysis:
# docs/Brainstorming_Eyelash_Corne_Touchpad_Battery_Usage.md
#
# This file is layered AFTER the shared config/eyelash_corne.conf, so these
# overrides win for the RIGHT half only (proven by the CONFIG_ZMK_DISPLAY=n
# override above). The LEFT keeps the shared values.
# =============================================================================

# (1) Shorten the deep-sleep timeout on the RIGHT only. Deep sleep (System OFF) is
# the ONLY event that cuts the touchpad's switched-VCC rail (EXT_POWER, P0.13), so
# the pad + I2C + BLE relay stay powered for the whole idle window before it. The
# shared eyelash_corne.conf keeps 15 min (900000) for the LEFT, so its OLED
# persistence is unchanged; the right has no display to keep alive. 300000 = 5 min.
# Trade-off: after this idle time the pad powers off and is dead until the next
# RIGHT-half keypress wakes the board; the driver's poll-until-ready + auto-recovery
# re-inits it sub-second. Raise toward 600000 (10 min) if the wake-lag on return
# feels too frequent; lower toward 180000 (3 min) for more savings.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# (2) Drop the peripheral's BLE TX power to 0 dBm. The shared eyelash_corne.conf
# sets +8 dBm (CONFIG_BT_CTLR_TX_PWR_PLUS_8) for the LEFT's host-PC link; the
# RIGHT's only BLE link is the ~20-30 cm split, where 0 dBm has ample margin
# (arrives ~-40 dBm vs ~-90 dBm sensitivity). CONFIG_BT_MAX_CONN=1 on the right
# guarantees this only affects the split link. If any split reconnect / touchpad
# relay stall appears at desk distance, switch the two lines below to
# CONFIG_BT_CTLR_TX_PWR_PLUS_4=y instead (a middle ground). The +8 dBm was chosen
# for split reliability (Problem 15); that fix was subscription-enforcement +
# advertising-retry, NOT TX power, so 0 dBm should keep the link reliable.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8 is not set
CONFIG_BT_CTLR_TX_PWR_0=y

