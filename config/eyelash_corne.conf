# Deep-sleep timeout (needs CONFIG_ZMK_SLEEP): after this idle time the SoC enters
# System OFF; waking RESETS the board and re-inits the OLED. 900000 = 15 min, matching
# zmk-config-rolio (sofle_left.conf).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_SLEEP=y

# Bluetooth / USB device name shown to the host (14 chars, fits ZMK's 16-char limit).
CONFIG_ZMK_KEYBOARD_NAME="Corne Touchpad"


# --- RGB underglow: DISABLED (this is the OLED-off-after-sleep root-cause fix) ---
# This hardware has NO underglow LEDs (confirmed), and zmk-config-rolio (our golden
# reference) enables no underglow either. Leaving it on was actively harmful:
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER defaults y, so RGB "off" calls ext_power_disable().
# With AUTO_OFF_IDLE=y, the 10-min idle turned RGB off -> disabled EXT_POWER -> and
# (because the board stays idle past the 60s settings-save debounce) PERSISTED
# ext_power/state=0 to flash. The OLED sits on that same EXT_POWER rail, so after the
# next deep-sleep wake (which reloads settings) the rail came up OFF and the OLED stayed
# dark until a settings_reset cleared the flag. Removing underglow removes that path
# entirely; EXT_POWER now stays on whenever the board is awake, so the OLED persists.
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Uncomment the following line to enable NKRO
#CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_MOUSE=y

# --- Azoteq IQS5xx touchpad ---
# Shared by both halves. The driver only instantiates on the half that has the
# iqs5xx@74 devicetree node (the right), so enabling these on both is harmless.
# CONFIG_I2C must be set explicitly: both the touchpad (right) and the SSD1306 OLED
# (left) sit on I2C0, and the Azoteq driver's `depends on I2C` would otherwise force
# it off. Each half owns I2C0 on its own side (OLED @0x3c left, touchpad @0x74 right).
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_ZMK_POINTING=y

# --- Backlight: DISABLED to match rolio and this hardware (no backlight LEDs) ---
# backlight.c has no EXT_POWER coupling so it wasn't part of the OLED brick, but it
# drives LEDs this keyboard doesn't have and rolio doesn't enable it. Off for parity.
# CONFIG_ZMK_BACKLIGHT=y
# CONFIG_ZMK_BACKLIGHT_BRT_START=100

# Uncomment the following line to increase the keyboard's wireless range
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_DISPLAY=y
# Keep the OLED on -- match rolio: do NOT blank on idle, and use a 10-min idle
# timeout (rolio's sofle_left.conf). Without this the panel blanks after 30s and
# (per testing) does not redraw cleanly.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Idle timeout = 10 min, matching zmk-config-rolio. With RGB underglow removed nothing
# disables EXT_POWER at idle, so the OLED stays powered until deep sleep.
CONFIG_ZMK_IDLE_TIMEOUT=600000
# SSD1306 OLED (128x32) on I2C0 -- the display panel this hardware has (left half).
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# OLED widgets: follow zmk-config-rolio -- use the nice_oled module DEFAULTS (WPM +
# bongo-cat, status, layer, fixed modifier indicators, HID indicators). Do NOT force
# the Luna (*_LUNA) widgets: upstream nice_oled compiles luna.c AND bongo_cat.c, which
# define the same globals (current_anim_state, idle/slow/mid/fast_imgs) with no extern,
# so enabling both fails to link ("multiple definition"). rolio renders correctly by
# using these defaults, so we match it (this is also why the display is no longer
# pixelized -- the previous techcaotri nice_oled fork was tuned for a nice_epaper panel).

# --- Show the RIGHT half (peripheral) connection/battery on the LEFT (central) OLED ---
# The peripheral-battery icon is the "right half connected" indicator (it appears once
# the central has fetched the peripheral over the split). Two parts are needed:
#   1) the central must FETCH the peripheral's battery level over the BLE split, and
#   2) the nice_oled battery widget must INCLUDE the peripheral.
# nice_oled is laid out for a tall 128x160 panel, so its battery widget defaults to
# Y=50 -- off-screen on this 128x32 OLED. Pull it into the visible top strip (0..31).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=18
