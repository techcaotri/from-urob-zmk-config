manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: urob
      url-base: https://github.com/urob
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: gpeye
      url-base: https://github.com/GPeye
    - name: techcaotri
      url-base: https://github.com/techcaotri
    # Azoteq IQS5xx touchpad driver (consumed as a Zephyr module). The base
    # driver lives upstream at AYM1607; our custom pinch-zoom + 3-finger-swipe
    # patches live in a local editable checkout that the prepare script links
    # into the workspace at the `zmk-driver-azoteq-iqs5xx` path (see
    # build_scripts_urob_zmk/prepare_zmk_build_environment.sh). To build from a
    # pushed fork instead, change `remote`/`revision` below to your fork.
    - name: aym1607
      url-base: https://github.com/AYM1607
  projects:
    # - name: eyelash_corne
    #   url: https://github.com/a741725193/zmk-new_corne
    #   revision: main
    # NOTE: revisions are pinned to the known-good stack that the eyelash_corne
    # variant builds against (ZMK April 2025 -> Zephyr v3.5.0+zmk-fixes). The
    # upstream branches above moved on to Zephyr 4.x, which the urob/eyelash_corne
    # board (old Zephyr board model) cannot build. Re-pin deliberately if bumping.
    - name: zmk
      remote: zmkfirmware
      revision: 6f85f48b19afae04f98e9abacb36ce1425b61f78
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: 8d7e79731803c961bae61f6fc8ffa3a35a62e5eb
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: ebbc1f0ccdb51669650bb0ac3e34920d09e62400
    - name: mario-peripheral-animation
      remote: gpeye
      revision: 1aa3950d6c86b4240b3f79d06bdbb04c5d920711
    - name: zmk-nice-oled
      remote: techcaotri
      revision: ff9969d3fdd49cb9a3a8ee3934b96781f2265aee
    - name: zmk-driver-azoteq-iqs5xx
      remote: aym1607
      revision: main
  self:
    path: config
