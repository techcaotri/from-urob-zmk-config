manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: urob
      url-base: https://github.com/urob
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: techcaotri
      url-base: https://github.com/techcaotri
    # Upstream nice_oled -- the SAME source zmk-config-rolio uses for its OLED. We
    # follow rolio here (its west.yml pins zmk-nice-oled to mctechnology17 @ main).
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    # - name: eyelash_corne
    #   url: https://github.com/a741725193/zmk-new_corne
    #   revision: main
    # NOTE: revisions are pinned to the known-good stack that the eyelash_corne
    # variant builds against (ZMK April 2025 -> Zephyr v3.5.0+zmk-fixes). The
    # upstream branches above moved on to Zephyr 4.x, which the urob/eyelash_corne
    # board (old Zephyr board model) cannot build. Re-pin deliberately if bumping.
    - name: zmk
      # techcaotri fork of zmkfirmware/zmk. Branch corne-touchpad = the pinned base
      # (6f85f48b19afae04f98e9abacb36ce1425b61f78) + the split-peripheral advertising
      # -EINVAL retry fix, so the split re-advertises and reconnects even while the
      # touchpad is generating load. Same Zephyr (app/west.yml unchanged from the base).
      remote: techcaotri
      revision: corne-touchpad
      import: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: 8d7e79731803c961bae61f6fc8ffa3a35a62e5eb
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: ebbc1f0ccdb51669650bb0ac3e34920d09e62400
    # nice_oled display widgets. Follow rolio's LATEST: rolio's config/west.yml pins
    # this to mctechnology17/zmk-nice-oled @ main, so we do too. (The previous
    # techcaotri fork @ ff9969d was tuned for a nice_epaper panel and rendered
    # pixelized/garbled on this hardware's 128x32 SSD1306 OLED.)
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    # Azoteq IQS5xx touchpad driver with our custom pinch-zoom and three-finger
    # swipe-up gestures (fork of AYM1607/zmk-driver-azoteq-iqs5xx). The touchpad
    # replaced the right-half OLED, so mario-peripheral-animation (the
    # nice_view_custom peripheral animation) is no longer used and was removed.
    - name: zmk-driver-azoteq-iqs5xx
      remote: techcaotri
      # corne-touchpad = feature/zoom-and-swipe + a dedicated touchpad work queue that
      # keeps the blocking I2C reads off the system work queue, so the BLE split's
      # reconnect (connection-cleanup + re-advertise) isn't starved during heavy
      # touchpad use. Pairs with the zmk advertising-retry fix above.
      revision: corne-touchpad
  self:
    path: config
